name: Sync ESPN data
run-name: ESPN sync (${{ github.event_name }})

on:
  schedule:
    # Tuesdays 12:00 UTC (08:00 ET), after Monday Night Football stats are final.
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Refetch every season since FIRST_SEASON (slow; use after editing owners.yml or overrides)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: espn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      FIRST_SEASON: ${{ vars.FIRST_SEASON || '2010' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$ESPN_LEAGUE_ID" ]; then
            echo "::error::ESPN_LEAGUE_ID secret is not set. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Pull from ESPN
        id: pull
        working-directory: sync
        run: |
          set +e
          if [ "${{ inputs.full_refresh }}" = "true" ]; then python espn_sync.py --all; else python espn_sync.py; fi
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            {
              echo "## ESPN rejected the credentials"
              echo "Your espn_s2 cookie has probably expired (they last about a year)."
              echo "1. Log in to fantasy.espn.com in Chrome"
              echo "2. DevTools > Application > Cookies > https://fantasy.espn.com"
              echo "3. Copy \`espn_s2\` and \`SWID\` (keep the curly braces on SWID)"
              echo "4. Update the ESPN_S2 and ESPN_SWID repository secrets and re-run this workflow"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit $code

      - name: Normalize + build stats
        working-directory: sync
        run: |
          python normalize.py --report | tee normalize.log
          python build_stats.py
          {
            echo "## Sync report"
            echo '```'
            cat normalize.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        working-directory: sync
        run: python -m pytest -q tests

      - name: Commit data
        run: |
          git config user.name "espn-sync[bot]"
          git config user.email "espn-sync@users.noreply.github.com"
          git add data public/logos public/headshots sync/owners.yml sync/overrides
          if git diff --cached --quiet; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "data: weekly ESPN sync $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
